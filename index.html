<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Dog Bot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Luna Dog Bot</h1>
            <div class="subtitle">Your friendly canine Twitch companion!</div>
        </header>
        
        <div class="dog-container">
            <div class="dog">
                <div class="dog-head">
                    <div class="dog-ears ear-left"></div>
                    <div class="dog-ears ear-right"></div>
                    <div class="dog-face">
                        <div class="dog-eyes eye-left"></div>
                        <div class="dog-eyes eye-right"></div>
                        <div class="dog-nose"></div>
                        <div class="dog-mouth" id="dog-mouth"></div>
                    </div>
                </div>
                <div class="dog-tail" id="dog-tail"></div>
            </div>
        </div>

        <div class="chat-section">
            <div class="twitch-info">
                <label for="channel">Twitch Channel:</label>
                <input type="text" id="channel" placeholder="Enter Twitch channel">
                <button id="connect-btn">Connect</button>
                <span id="status-indicator">Disconnected</span>
            </div>
            
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="interaction">
                    <input type="text" id="message-input" placeholder="Say something to Luna...">
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="config.js"></script>
    <script type="module" src="script.js"></script>

</body>
</html>
